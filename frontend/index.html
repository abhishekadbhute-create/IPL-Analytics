<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Analytics Dashboard</title>
    
    <!-- SEO & Meta -->
    <meta name="description" content="A premium full-stack IPL Analytics Dashboard featuring insights on players, bowlers, teams, and venues.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Plotly -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-animated"></div>
    <div class="bg-blur"></div>

    <div class="app-container" style="justify-content: center;">
        <!-- Main Content Area -->
        <main class="main-content" style="max-width: 900px; width: 100%; margin: 0 auto; padding-top: 10vh; display: flex; flex-direction: column; align-items: center;">
            
            <div class="logo" style="margin-bottom: 24px; flex-direction: column; gap: 8px;">
                <i class="ph-fill ph-cricket" style="font-size: 64px;"></i>
                <h2 style="font-size: 42px;">IPL<span>AI Search</span></h2>
            </div>
            
            <p style="color: var(--text-secondary); margin-bottom: 32px; font-size: 18px;">Ask anything about IPL history, players, and teams.</p>

            <div class="search-bar" style="width: 100%; max-width: 600px; padding: 16px 24px; margin-bottom: 40px; box-shadow: var(--shadow-glow);">
                <i class="ph ph-magnifying-glass" style="font-size: 24px;"></i>
                <input type="text" id="nlp-search-input" placeholder="e.g. Compare Virat Kohli and Rohit Sharma" style="font-size: 18px;">
                <button id="nlp-search-btn" class="icon-btn" style="background: var(--primary); margin-left: 8px; width: 48px; height: 48px;"><i class="ph ph-arrow-right"></i></button>
            </div>

            <!-- Dynamic Views Container -->
            <div class="view-container" id="view-container" style="width: 100%; padding: 0;">
                <!-- Content will be injected here by nlp.js -->
            </div>
        </main>
    </div>

    <!-- Application Logic -->
    <script src="js/app.js"></script>
    <script src="js/nlp.js"></script>
</body>
</html>
